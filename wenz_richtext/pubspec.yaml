name: wenz_richtext
description: A self-owned Flutter rich text editor core and widgets.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.4 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  dart_openai: ^5.1.0
  flutter_math_fork: 0.7.4
  flutter_svg: ^2.0.10+1
  highlight: ^0.7.0
  html: ^0.15.6
  http: ^1.0.0
  merman: ^0.8.0-alpha.2
  path_provider: ^2.1.0
  super_clipboard: ^0.9.1
  super_drag_and_drop: ^0.9.1
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
