name: wenz_richtext_example
description: Wenz RichText local example app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  wenz_richtext:
    path: ..
  # 图片文件选择（仅 example 端；核心包不内置平台文件选择依赖）。
  file_selector: ^1.1.0
  # 链接打开：Ctrl/Cmd+点击正文链接 / hover「打开」时拉起系统浏览器。
  # 仅 example 端引入；核心包 wenz_richtext 通过 onOpenLink 回调将打开方式交由宿主决定。
  url_launcher: ^6.3.1
  # 真实视频播放依赖（仅 example 端，核心包 wenz_richtext 不引入播放依赖）。
  # 选型：media_kit（基于 libmpv）—— Windows 桌面/Web 均原生可播 mp4/webm，
  # 无需额外手改 native 目录；video_player 路线官方不含 Windows 桌面端故弃用。
  media_kit: ^1.2.6 # 核心 API：Player/Media/Playlist。
  media_kit_video: ^2.0.1 # 视频渲染：VideoController/Video。
  media_kit_libs_video: ^1.0.7 # 各平台 libmpv 运行时库（Windows/Web 等）。

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # 本地样例视频素材（来源 d:/video，详见 docs/plan/plan_requirement_56）。
    # 拷贝自 d:/video/v1.0.10.beta更新视频/split/00_开场介绍.mp4（mp4/H.264/AAC，~22.5s，4.4MB），
    # 供 example 端 VideoBlockNode.file='assets/videos/sample.mp4' 真实播放使用。
    - assets/videos/
