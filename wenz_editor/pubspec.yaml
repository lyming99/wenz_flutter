name: wenz_editor
description: "editor"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  ydart:
    path: ../ydart

  wenz_flutter_html:
    git: https://github.com/lyming99/wenz_flutter_html.git
  dart_markdown: ^3.1.6
  future_progress_dialog: ^0.2.1
  window_manager: ^0.5.1
  flutter_code_editor: ^0.3.2
  oktoast: ^3.4.0
  uuid: ^4.1.0
  super_drag_and_drop: ^0.8.24
  octo_image: ^2.0.0
  flutter_math_fork: ^0.7.3
  image_size_getter: ^2.1.2
  super_clipboard: ^0.8.24
  pasteboard: ^0.4.0
  path_provider: ^2.1.4
  dio: ^5.5.0+1
  archive: ^3.3.6
  bot_toast: ^4.1.3
  pdf: ^3.11.1
  easy_image_viewer: ^1.5.1
  image_picker: ^1.1.2
  flutter_colorpicker: ^1.0.3
  file_saver: ^0.2.14
  wenz_ui:
    path: ../wenz_ui
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
